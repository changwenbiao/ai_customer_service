# 调试覆盖配置：只改 go / agent 服务的构建方式并暴露各自的调试端口
# 用法：docker compose -f docker-compose.yaml -f docker-compose.debug.yaml up -d --build
# 只调某一个：... up -d --build go / ... up -d --build agent
# 恢复生产：docker compose up -d --build go agent
services:
  go:
    build:
      context: .
      dockerfile: go_service/Dockerfile.debug
    ports:
      # 只绑回环地址，避免把调试端口暴露到局域网
      - "127.0.0.1:2345:2345"
    # dlv 需要 ptrace 才能挂载到被调试进程
    cap_add:
      - SYS_PTRACE

  agent:
    build:
      context: ./python_agent
      dockerfile: Dockerfile.debug
    ports:
      # debugpy 调试端口，同样只绑回环地址
      - "127.0.0.1:5678:5678"
