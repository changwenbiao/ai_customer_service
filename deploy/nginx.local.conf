# 本地调试版 nginx 配置：前端静态资源仍用镜像内文件，API/WS 反代到宿主机本地 Go
# 与 deploy/nginx.conf 唯一区别：upstream 从 go:8080 改为 host.docker.internal:8082
server {
    listen 80;
    server_name _;

    client_max_body_size 110m;

    # Docker 内置 DNS，host.docker.internal 可通过 127.0.0.11 解析
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 管理后台（Vue3 单页应用，构建产物在 web/admin/dist）
    location /admin/ {
        alias /usr/share/nginx/html/web/admin/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # 聊天内核（PC + H5）
    location /chat/ {
        alias /usr/share/nginx/html/web/chat/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # SDK 接入脚本 + 多端接入示例
    location /sdk/ {
        alias /usr/share/nginx/html/web/sdk/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # 知识库原文件：本地为 python_agent/data/kb_files 的 bind mount
    location /kb_files/ {
        alias /usr/share/nginx/html/kb_files/;
        add_header Cache-Control "public, max-age=86400";
        charset utf-8;
    }

    # 会话图片：本地为 data/msg_files 的 bind mount（Go 写入）
    location /msg_files/ {
        alias /usr/share/nginx/html/msg_files/;
        add_header Cache-Control "public, max-age=86400";
    }

    # SDK 版本化 URL
    location ~ ^/sdk/cs-chat@[0-9]+\.[0-9]+\.[0-9]+\.js$ {
        alias /usr/share/nginx/html/web/sdk/cs-chat.js;
        add_header Cache-Control "public, max-age=86400";
    }

    location = / {
        return 301 /sdk/;
    }

    # API 与 WebSocket 反代到宿主机本地 Go 网关（127.0.0.1:8082）
    location / {
        set $go_backend "http://host.docker.internal:8082";
        proxy_pass $go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
