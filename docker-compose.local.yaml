# 本地开发覆盖层：Go 和 Agent 都在宿主机跑（GoLand / PyCharm 调试），
# 容器只保留 MySQL / PostgreSQL / Qdrant / Redis 和 nginx（前端入口 + 静态资源）。
# 用法：docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d --no-deps mysql postgres qdrant redis nginx
services:
  redis:
    # 本地 Go / Agent 需要从宿主机连 Redis
    ports:
      - "127.0.0.1:6379:6379"

  nginx:
    # !override 替换基础编排里的卷列表，避免同一挂载点重复：
    # 1) 使用本地调试配置，把 /api 反代到宿主机 127.0.0.1:8082
    # 2) 知识库文件直接读 python_agent/data/kb_files（本地 Agent 写入）
    # 3) 会话图片直接读 data/msg_files（本地 Go 写入）
    volumes: !override
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./python_agent/data/kb_files:/usr/share/nginx/html/kb_files:ro
      - ./data/msg_files:/usr/share/nginx/html/msg_files:ro
    # 去掉对 go 容器的依赖，否则 nginx 启动会顺带拉起 go/agent 容器
    depends_on: !reset []
